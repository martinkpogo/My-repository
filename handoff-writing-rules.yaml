# ENIG Handoff Field-Writing Rules
#
# Applies to EVERY write to the Handoffs database in Notion -- whether
# performed by the deployed runtime's own code, or by a human/agent
# operating on Notion directly (manual Handoff creation, corrections,
# resubmissions, cleanup).
#
# The runtime now enforces this rule in code, at a single point every
# production Handoff write goes through: src/handoffWriter.ts's
# createHandoff/updateHandoff. Every Unit that creates or updates a
# Handoff (Sales, Strategy, Finance, Marketing)
# calls into that module rather than writing to the Handoffs database
# directly -- it requires an operational Entity/Matter reference (the
# opaque token entries the Sources payload itself must carry, or a route
# explicitly declared generic), and rejects (fails
# closed, never silently redacts) any protected field that contains a
# real Entity/Matter name, a known contact's name, an email address, or a
# phone number. It builds on resolveIdentityTokens
# (src/units/sales/salesExecutive.ts) and the closed-context contract
# (src/dataBoundary/policy.ts's evaluateHandoffContext), which remain the
# authority for identity resolution itself -- src/handoffWriter.ts is the
# write-side enforcement point, not a second identity-resolution mechanism.
#
# This file remains the manual-operator equivalent of that same rule: a
# human or agent operating on Notion directly bypasses the runtime's own
# code path entirely and has to apply the same discipline by hand,
# deliberately, every time.

opaque_token_boundary:
  rule: >
    Every Handoff field that becomes another Unit's AI input context
    (Handoff title, Reason, Sources, Required Next Action, Expected Output,
    Acceptance Criteria, Assumptions, Open Questions, Verified Facts &
    Sources, Work Completed) must identify the Entity/Matter ONLY by the
    opaque token entries its own Sources payload carries (the link-less
    rich-text entries "token:entity:E-20" and "token:matter:MAT-20") or,
    additionally, by exact canonical page references in that same
    property -- never by the
    real Entity/company name, a real contact's name, an email address, a
    phone number, or any other detail that identifies who they actually
    are. Sources URLs are included deliberately: a Notion pretty-URL slug
    is derived from the page title, so a link whose slug carries a real
    company or contact name writes identity into the Handoff just as
    surely as prose would.

  never_write:
    - Real Entity/company name (e.g. "Meridian Foods Ghana Ltd")
    - Real contact names (e.g. "Comfort Agyare", "Daniel Agyeman")
    - Email addresses or phone numbers
    - Any other detail that could identify the Entity outside its token

  always_write:
    - token:entity:<token> entry in Sources -- the Entity page's "Entity ID"
      unique_id value (e.g. "E-20"), as link-less rich text (no page link)
    - token:matter:<token> entry in Sources -- the Matter page's "Matter_ID"
      unique_id value (e.g. "MAT-20"), as link-less rich text (no page link)
    # The separate Entity_Token / Matter_Token Handoff properties no longer
    # exist in the live schema: no record writes them and no code path reads
    # them. A Handoff must not carry them in any form.

  reading_real_identity_is_fine:
    note: >
      Reading the full Entity/Matter page, an email thread, or supplied
      documents is expected and necessary to gather evidence -- the
      boundary is about what gets WRITTEN into a Handoff field, not what
      is read while preparing one. The runtime's own resolveIdentityTokens
      reads the entire Entity/Matter page and then deliberately discards
      everything except the token; a manual operator must do the same
      thing by hand -- resolve the real identity to its token before
      writing anything forward, not while reading source material.

  before_writing_a_handoff_by_hand:
    - Look up the Entity page's "Entity ID" and the Matter page's
      "Matter_ID" properties (or copy them verbatim from an existing
      Handoff already on record for the same case) -- use those, never
      the Name/Matter title.
    - Re-read every field about to be written and confirm it contains no
      real name, contact, or contact detail before submitting.

  incident_reference: >
    HO-58 (Meridian Foods Ghana Ltd / E-20 / MAT-20, 2026-09-22) violated
    this rule -- the real company name and contact details (name, email)
    were written into the Handoff title and Verified Facts & Sources when
    it was created by hand, bypassing the runtime's own
    resolveIdentityTokens enforcement entirely. Left as historical record
    (test-engagement data, not a real client-data exposure) rather than
    scrubbed; see the Activity & Decision Log entry consolidating HO-58
    for the full account. This file exists to stop it happening again.

# --- The Sources property (manual equivalent) ---
#
# The runtime enforces Sources validation in code at one point:
# src/handoffWriter.ts's createHandoff/updateHandoff (deterministic,
# no fetches) and src/handoffSources.ts's resolveHandoffSources at pickup
# (the full binding chain, fail-closed). A manual writer bypasses both and
# must apply the same discipline by hand.

sources_property:
  when_present_means: >
    The Handoff's evidence lives on the canonical artifacts it names, and
    with the Sources path enabled the runtime reads ONLY what it declares
    (the free-text Call_Notes_ID reference is never consulted as a
    fallback for a Sources-enabled Handoff, and the Handoff's own
    narrative is outranked by the declared source exactly as a declared
    canonical Call Notes page outranks it). Never add the property "for
    documentation" on a Handoff whose evidence is actually its narrative.

  write_only_exact_references:
    - Exact Notion PAGE links (a page id URL; never a database/view link,
      never a title to search for)
    - Direct Google Docs/Sheets file links on docs.google.com (note: a
      Google Sheet source is parsed but refused by the runtime today --
      no trusted binding exists for spreadsheets; do not write one)
    - At least one reference; no duplicates of the same page/file
    - The opaque token pair, as token:entity:/token:matter: entries, on
      every route whose contract requires identity (today:
      Sales->Strategy, Strategy->Finance, Finance->Sales,
      Strategy->Marketing, Strategy->Sales -- all five require BOTH
      tokens)
    - Only on a route whose contract permits the types involved
      (today: Sales->Strategy and Strategy->Finance allow call_notes;
      Sales->Strategy and Strategy->Finance also allow canonical
      entities/matters page references; the other three carry the tokens
      and no artifact type)

  never_write:
    - Title-matched, searched, or guessed references
    - Links whose slug or query string carries real identity
    - A Sources property on a Handoff whose recorded route has no source
      route contract (the runtime refuses such a record fail-closed)

  incident_reference: >
    No incident yet -- the property went live with Phase 2 (2026-10-16)
    together with this file's update, unlike opaque_token_boundary whose
    HO-58 incident predates its enforcement.

# --- Sales -> Strategy source-boundary attestation (manual equivalent) ---
#
# The runtime enforces this in code at one point: src/handoffWriter.ts's
# createHandoff establishes five source-boundary checks BEFORE writing a
# Sales -> Strategy Handoff, refuses (throws) if any check fails or cannot
# be established -- so no Pending Sales -> Strategy Handoff can exist
# without an explicit Passed result -- and persists that result as an
# attestation marker inside the Handoff creation payload itself (the Reason
# field, the same free-text marker channel already used for
# requiredCategory). A receiving Strategy execution reads that marker from
# the record and fails closed when it is missing, malformed, Failed, or not
# bound to the Handoff; it consumes the evidence and never re-runs the
# Sales boundary check.
#
# The section below is the manual/agent equivalent for a Handoff written
# directly in Notion (isolated Sales project, human operator, or AI agent),
# which bypasses the runtime's code path entirely. It is PROCEDURAL
# ATTESTATION: the operator applies the checks by hand and records the same
# marker. It is NOT runtime validation -- the runtime does not and cannot
# verify that a hand-applied check actually ran. Never write a Passed marker
# unless every check below was genuinely performed for THIS Handoff.

sales_to_strategy_source_boundary_attestation:
  applies_when: >
    From Unit is Sales AND To Unit is Strategy, on a Handoff written
    directly in Notion rather than through the deployed runtime.

  required_result: Passed

  failure_rule: >
    If any check fails or cannot be established, the Handoff must not be
    left Pending -- record result=Failed in the marker (or omit the marker)
    and hold the record for follow-up. Strategy fails closed on anything
    other than an explicit Passed marker bound to the Handoff.

  checks:
    - operational_entity_reference_present   # the Entity token entry (token:entity:<token>) is present in Sources, from the operational Entity ID -- never empty, never a real name
    - operational_matter_reference_present   # the Matter token entry (token:matter:<token>) is present in Sources, from the operational Matter ID
    - identity_bearing_content_removed       # every protected field re-read: no real Entity/Matter/contact name, email address, or phone number (see opaque_token_boundary above)
    - identity_resolution_registry_data_not_transferred   # no Identity Resolution Registry data was read into or copied into this Handoff
    - handoff_context_identity_safe          # the final payload, re-read as a whole, contains only identity-safe content

  marker:
    channel: Reason free text (the same channel the runtime writes)
    identity_form: "[source_boundary_check result=Passed entity=<entity_token> matter=<matter_token> checks=operational_entity_reference_present,operational_matter_reference_present,identity_bearing_content_removed,identity_resolution_registry_data_not_transferred,handoff_context_identity_safe fields=<comma-separated known-identity field names actually compared, e.g. entityName,matterName -- names only, never values>]"
    sources_form: "[source_boundary_check result=Passed refs=<comma-joined sorted exact source page ids the Handoff's Sources declares> checks=identity_bearing_content_removed,identity_resolution_registry_data_not_transferred,handoff_context_identity_safe fields=<comma-separated known-identity field names actually compared>]"
    form_selection: >
      A write whose operational identity is an opaque token pair records
      the identity form with all five checks: checks 1 and 2 are
      established because the write's OWN declared tokens are present in
      its Sources payload, and a contradiction between a caller's identity
      tokens and the payload's declared tokens is refused rather than
      silently reconciled. A write whose operational identity is not a
      token pair (a route explicitly declared generic) records the sources
      form with only the three content checks -- checks 1 and 2 (operational
      Entity/Matter reference) are established by the RECEIVER's own
      resolution of those exact sources, never claimed by the sender.
    binding: >
      The identity form's entity= and matter= must be exactly the opaque
      tokens this Handoff's own Sources payload declares. The sources
      form's refs= must be exactly the set of source page ids the
      receiver's own resolution validated for this Handoff. Either way that
      is what binds the attestation to this record: the receiving Strategy
      execution rejects a marker whose references do not match the Handoff
      it was read from, in whichever form it resolves that Handoff. A
      marker records only checks that were actually performed and can never
      substitute for the receiver's own validation.
    contains_no_identity: >
      The marker carries tokens or exact page ids, the result, the check
      names actually established, and known-identity FIELD names only --
      never a real name, email address, phone number, or any other
      identifying value.

  distinction: >
    A runtime-created Handoff's marker is produced by enforced code (the
    validate-then-create sequence runs before any write). A marker written
    by hand is an operator's attestation under this file's discipline --
    the same evidence shape, but procedural assurance rather than runtime
    validation. Never represent a hand-written marker as runtime-validated,
    and never weaken the runtime check because a manual equivalent exists.
