name: Deploy Worker

# Cloudflare Workers Builds (the Git-connected pipeline on the Cloudflare
# side) does the actual deployment on every push -- this workflow does not
# deploy anything itself. It exists purely to confirm, from GitHub's side,
# that a deployment actually landed after a merge, since a completed run of
# this workflow (success or failure) is what surfaces as a notification.
#
# Deliberately triggered by `workflow_run` off "Auto Merge" completing,
# not `on: push`: auto-merge.yml merges using secrets.GITHUB_TOKEN, and
# GitHub's anti-recursion rule means a GITHUB_TOKEN-authored push never
# triggers another workflow's `on: push` -- confirmed live: this workflow
# silently stopped firing entirely from PR #165 onward (10+ merges with
# zero runs) once auto-merge.yml started performing the actual merge.
# `workflow_run` is not subject to that same suppression (the same
# mechanism auto-merge.yml itself relies on, chained off "PR Validation"),
# so this fires reliably regardless of who authored the merge push.
on:
  workflow_run:
    workflows: ["Auto Merge"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Cloudflare Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # Cloudflare Workers Builds deploys asynchronously on its own push
      # trigger, not synchronously with this workflow -- give it a window
      # to land before checking, rather than racing it.
      - name: Wait for Cloudflare's deployment to land
        run: sleep 45

      - name: Verify post-deployment health endpoint
        run: |
          HEALTH_URL="https://enig-agent.martnkpogo.workers.dev/health"
          RESPONSE=$(curl -sS -w "\n%{http_code}" "$HEALTH_URL")
          STATUS_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          if [ "$STATUS_CODE" -ne 200 ] || [ "$BODY" != "ok" ]; then
            echo "Health verification failed with HTTP status $STATUS_CODE"
            exit 1
          fi
          echo "Health verification succeeded with status HTTP $STATUS_CODE"
