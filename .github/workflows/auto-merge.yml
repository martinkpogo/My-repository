name: Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto Merge Pull Request
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
            if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
              PR_NUM=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/pull_requests --jq '.[0].number')
            fi
            if [ -n "$PR_NUM" ] && [ "$PR_NUM" != "null" ]; then
              echo "Enabling auto-merge for PR #$PR_NUM..."
              gh pr merge "$PR_NUM" --auto --squash --delete-branch || true
            fi
          else
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "Enabling auto-merge for PR #$PR_NUM..."
            gh pr merge "$PR_NUM" --auto --squash --delete-branch || true
          fi
