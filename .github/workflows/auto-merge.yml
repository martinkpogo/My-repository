name: Auto Merge

on:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Auto Merge Pull Request
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Enable Auto-Merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "PR Validation workflow did not succeed (conclusion: $CONCLUSION). Skipping auto-merge."
            exit 0
          fi

          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          if [ -z "$HEAD_BRANCH" ] || [ "$HEAD_BRANCH" = "null" ]; then
            echo "No head_branch found in workflow run event. Skipping auto-merge."
            exit 0
          fi

          echo "Resolving open PR for branch '$HEAD_BRANCH'..."
          PR_INFO=$(gh pr list --head "$HEAD_BRANCH" --state open --json number,isDraft,state --jq '.[0]')
          if [ -z "$PR_INFO" ] || [ "$PR_INFO" = "null" ]; then
            echo "No open PR found for head branch '$HEAD_BRANCH'. Skipping auto-merge."
            exit 0
          fi

          PR_NUM=$(echo "$PR_INFO" | jq -r '.number')
          IS_DRAFT=$(echo "$PR_INFO" | jq -r '.isDraft')

          if [ "$IS_DRAFT" = "true" ]; then
            echo "PR #$PR_NUM is currently in Draft state. Skipping auto-merge."
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUM (state: open, isDraft: false)..."
          gh pr merge "$PR_NUM" --auto --squash --delete-branch
