name = "enig-agent"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "WORK_SESSION"
class_name = "WorkSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WorkSession"]

[[kv_namespaces]]
binding = "STATE_KV"
id = "9c01e73f957949d796de688c1c37cbf0"

[triggers]
# Every 15 minutes for Finance-Handoff discovery. The separate
# stale-handoff Telegram digest throttles itself to at most once per 15
# min regardless of how often this fires — see
# STALE_HANDOFF_DIGEST_MIN_INTERVAL_MS in src/index.ts. This native
# trigger has never actually fired on this account (see
# /admin/last-cron-run) — the real schedule is the external cron-job.org
# job hitting /admin/run-finance-discovery, which must be updated to
# match separately.
crons = ["*/15 * * * *"]

[vars]
NOTION_VERSION = "2025-09-03"
AI_MODEL_PRIMARY = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_LIGHT = "@cf/meta/llama-3.1-8b-instruct-fast"
ENTITY_DATA_SOURCE_ID = "437248f7-f6d8-4e70-873b-7b1eb0fdc519"
MATTERS_DATA_SOURCE_ID = "0e68feef-224d-433d-a813-0f6ec5e1c036"
PROPOSALS_DATA_SOURCE_ID = "3b7bf0fa-7664-4ef1-a91b-282316696b6c"
HANDOFFS_DATA_SOURCE_ID = "935cff62-de01-4920-9743-782c7d210455"
ACTIVITY_LOG_DATA_SOURCE_ID = "423e7f93-5f9d-435d-856a-e183120d3d8f"
# Maps each Unit to its Telegram forum topic's message_thread_id in the
# ENIG HQ Supergroup, simulating one dedicated AI Workspace per Unit.
UNIT_TOPIC_MAP = '{"SM&BD": 4, "Finance": 6, "Strategy": 8, "Research & Intelligence": 10, "Creative & Design": 12, "Operations": 14}'
# The ENIG HQ Supergroup's chat id — where email-sourced enquiries (and
# any other session-less notification we choose to send there) land.
TELEGRAM_GROUP_CHAT_ID = "-1004435157576"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_WEBHOOK_SECRET
#   MARTIN_TELEGRAM_USER_ID
#   NOTION_TOKEN
#   READAI_WEBHOOK_SECRET (optional — only needed if you wire up Read.ai)
#   EMAIL_WEBHOOK_SECRET (optional — only needed if you wire up Gmail intake)
